services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: ./web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "3001:3000"
    depends_on:
      - db

  # AirVPN WireGuard tunnel for the scraper. Its firewall drops all traffic
  # while the tunnel is down, so scrapes fail instead of falling back to the
  # home IP. Needs its own AirVPN device key: the arr-stack's gluetun already
  # uses the other one, and one key can't hold two tunnels at once.
  vpn:
    image: qmcgaw/gluetun:v3.41.3
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: airvpn
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${AIRVPN_WG_PRIVATE_KEY}
      WIREGUARD_PRESHARED_KEY: ${AIRVPN_WG_PRESHARED_KEY}
      WIREGUARD_ADDRESSES: ${AIRVPN_WG_ADDRESSES}
      SERVER_COUNTRIES: Canada
      # GC Jobs (Government of Canada, NRC, StatCan) drops connections from
      # AirVPN's Toronto exit 104.254.90.162, but both Montreal servers
      # (Lacerta, Ross) get through (checked 2026-11-03).
      SERVER_CITIES: Montreal
      # Lets the scraper reach db outside the tunnel.
      FIREWALL_OUTBOUND_SUBNETS: 172.16.0.0/12
      TZ: ${TZ}
    # gluetun's own DNS server can't resolve compose service names, so "db"
    # points at the Docker host, where db's published port 5432 is open.
    extra_hosts:
      - "db:host-gateway"

  scraper:
    build: ./scraper
    restart: unless-stopped
    # All scraper traffic (httpx and Playwright) goes through the vpn service.
    network_mode: "service:vpn"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TZ: ${TZ}
    depends_on:
      vpn:
        condition: service_healthy
      db:
        condition: service_started

volumes:
  postgres_data:
