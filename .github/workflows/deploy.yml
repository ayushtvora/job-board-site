name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          # Default checkout behavior runs `git clean -ffdx`, which would
          # delete the server's production .env (gitignored) on every run
          # after the first. It lives in this same directory, so skip clean.
          clean: false

      - name: Build images
        run: docker compose build

      - name: Run database migrations
        run: docker compose run --rm web npx prisma migrate deploy

      - name: Deploy
        run: docker compose up -d
